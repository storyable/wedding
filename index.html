/* 모바일 청첩장 준비 중 안내 페이지 (실제 청첩장은 invitation/build.mjs 로 만들어요) */
:root{--ink:#262626;--muted:#77736C;--wine:#6B0E1A;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#F0EFEC;color:var(--ink);font:400 16px/1.85 'Gowun Batang',serif;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 20px;min-height:100svh}
main{max-width:420px}
.ribbon{width:52px;display:block;margin:0 auto 34px}
.names{font:400 44px/1.3 'Mrs Saint Delafield',cursive;margin:0;white-space:nowrap}
.date{font:400 13px Montserrat,sans-serif;letter-spacing:3px;color:var(--muted);margin:14px 0 46px;padding-left:3px}
.msg{margin:0}
.msg b{font-weight:700}
.sub{color:var(--muted);font-size:15px;margin-top:10px}
.rule{width:28px;height:1px;background:rgba(38,38,38,.3);margin:44px auto 0;border:0}
</style>
</head>
<body>
<main>
  <svg class="ribbon" viewBox="0 0 60 50" aria-hidden="true"><g fill="none" stroke="#6B0E1A" stroke-width="3.6"><path d="M28.5 17C25 27 19 37 11.5 46"/><path d="M31.5 17C35 27 41 37 48.5 46"/><path d="M30 15C21 4 7 5 7 11.5c0 6.5 13 8.5 23 3.5Z"/><path d="M30 15C39 4 53 5 53 11.5c0 6.5-13 8.5-23 3.5Z"/></g><rect x="26.5" y="11" width="7" height="8" rx="2.2" fill="#6B0E1A"/></svg>

  <p class="sub">정성껏 준비해서 곧 찾아뵐게요.</p>
  <hr class="rule">
</main>
